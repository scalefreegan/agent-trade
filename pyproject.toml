[project]
name = "agent-trade"
version = "0.1.0"
description = "MCP server for stock market data and news"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0b2",
    "yfinance>=0.2.40",
    "tiingo",
    "newsapi-python",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Optional: for programmatic/CLI use with Claude Code CLI (no API key required)
agent = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

# Optional: for web UI backend (includes agent deps for experiment/agent_runner)
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

# Optional: for running tests
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
]

[project.scripts]
# Run as standalone MCP server
agent-trade = "agent_trade.server:main"
# Run headless CLI queries via Anthropic API (requires agent extra)
agent-trade-query = "agent_trade.cli:main"
# Automate Claude Code CLI (requires agent extra)
agent-trade-claude = "agent_trade.claude_cli:main"
# View tool usage logs and statistics
agent-trade-logs = "agent_trade.logs_cli:main"
# Multi-agent trading experiment CLI (requires agent extra)
agent-trade-experiment = "agent_trade.experiment.experiment_cli:main"
# Web UI server (requires web extra)
agent-trade-web = "agent_trade.web.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
