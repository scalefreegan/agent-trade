name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Diagnose - single file test
        run: |
          echo "::group::test_logging_config"
          uv run pytest tests/test_logging_config.py -v -x --no-header -p no:timeout
          echo "::endgroup::"

          echo "::group::test_claude_wrapper"
          uv run pytest tests/test_claude_wrapper.py -v -x --no-header -p no:timeout
          echo "::endgroup::"

          echo "::group::experiment/test_agent_runner"
          uv run pytest tests/experiment/test_agent_runner.py -v -x --no-header -p no:timeout
          echo "::endgroup::"

          echo "::group::experiment/test_models"
          uv run pytest tests/experiment/test_models.py -v -x --no-header -p no:timeout
          echo "::endgroup::"

          echo "::group::web/test_search_router"
          uv run pytest tests/web/test_search_router.py -v -x --no-header -p no:timeout
          echo "::endgroup::"

          echo "=== ALL INDIVIDUAL FILES PASSED ==="

      - name: Run all tests together
        run: |
          echo "=== STARTING ALL TESTS ==="
          uv run pytest tests/ -v -x --no-header -p no:timeout
          echo "=== ALL TESTS PASSED ==="
