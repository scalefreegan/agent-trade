name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Unit without server_tools (test fastmcp theory)
        run: |
          echo ">>> unit tests WITHOUT test_server_tools.py"
          timeout -s KILL 90 .venv/bin/python -m pytest tests/ \
            --ignore=tests/web --ignore=tests/experiment \
            --ignore=tests/test_server_tools.py \
            -v -x --no-header -p no:timeout \
            && echo "PASS" || echo "FAIL/KILLED (exit $?)"

      - name: Only test_server_tools
        run: |
          echo ">>> just test_server_tools.py"
          timeout -s KILL 90 .venv/bin/python -m pytest tests/test_server_tools.py \
            -v -x --no-header -p no:timeout \
            && echo "PASS" || echo "FAIL/KILLED (exit $?)"

      - name: Experiment tests
        run: |
          timeout -s KILL 90 .venv/bin/python -m pytest tests/experiment/ \
            -v -x --no-header -p no:timeout \
            && echo "PASS" || echo "FAIL/KILLED (exit $?)"

      - name: Web tests
        run: |
          timeout -s KILL 90 .venv/bin/python -m pytest tests/web/ \
            -v -x --no-header -p no:timeout \
            && echo "PASS" || echo "FAIL/KILLED (exit $?)"

      - name: Full suite with coverage (macOS fallback if needed)
        if: success()
        run: |
          .venv/bin/python -m pytest tests/ \
            --cov=src/agent_trade \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v \
            --timeout=60 \
            --timeout-method=thread
