name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Debug - run minimal test
        run: |
          uv run python -c "import agent_trade; print('import ok')"
          uv run pytest tests/test_logging_config.py -v --no-header --timeout=15 -x
          echo "=== logging_config done ==="

      - name: Debug - run all unit tests (no coverage)
        run: |
          uv run pytest tests/ -v --timeout=30 -x --no-header

      - name: Run full suite with coverage
        if: success()
        run: |
          uv run pytest tests/ \
            --cov=src/agent_trade \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v \
            --timeout=60 \
            --timeout-method=thread
