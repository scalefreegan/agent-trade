name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Debug info
        run: |
          uv run python --version
          uv run python -c "import sys; print(f'platform={sys.platform}')"
          uv run python -c "import asyncio; p = asyncio.get_event_loop_policy(); print(f'loop_policy={p.__class__.__name__}')"
          echo "Test count:"
          uv run pytest tests/ --collect-only -q 2>&1 | tail -1

      - name: Run tests with raw output
        run: |
          echo ">>> Starting pytest at $(date -u +%T)"
          uv run python -u -m pytest tests/ -v -x -s -p no:timeout 2>&1
          echo ">>> Finished at $(date -u +%T)"
