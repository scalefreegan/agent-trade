name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests (non-web)
        run: |
          uv run pytest tests/ --ignore=tests/web --ignore=tests/experiment \
            -v --timeout=60 --timeout-method=thread 2>&1

      - name: Run experiment tests
        run: |
          uv run pytest tests/experiment/ \
            -v --timeout=60 --timeout-method=thread 2>&1

      - name: Run web tests
        run: |
          uv run pytest tests/web/ \
            -v --timeout=60 --timeout-method=thread 2>&1

      - name: Run full suite with coverage
        run: |
          uv run pytest tests/ \
            --cov=src/agent_trade \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v \
            --timeout=60 \
            --timeout-method=thread
