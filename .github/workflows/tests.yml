name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Identify hanging test file
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"
            timeout 60 uv run pytest "$f" -v --timeout=30 --timeout-method=thread 2>&1 || echo "FAILED/TIMEOUT: $f (exit $?)"
            echo "::endgroup::"
          done

      - name: Run experiment tests
        run: |
          timeout 120 uv run pytest tests/experiment/ \
            -v --timeout=30 --timeout-method=thread

      - name: Run web tests
        run: |
          timeout 120 uv run pytest tests/web/ \
            -v --timeout=30 --timeout-method=thread

      - name: Run full suite with coverage
        if: success()
        run: |
          uv run pytest tests/ \
            --cov=src/agent_trade \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v \
            --timeout=60 \
            --timeout-method=thread
