name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Unit tests (non-web, non-experiment)
        timeout-minutes: 3
        run: |
          uv run pytest tests/ --ignore=tests/web --ignore=tests/experiment \
            -v -x -p no:timeout --no-header

      - name: Experiment tests
        timeout-minutes: 3
        run: |
          uv run pytest tests/experiment/ \
            -v -x -p no:timeout --no-header

      - name: Web tests
        timeout-minutes: 3
        run: |
          uv run pytest tests/web/ \
            -v -x -p no:timeout --no-header

      - name: Full suite with coverage
        if: success()
        run: |
          uv run pytest tests/ \
            --cov=src/agent_trade \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v \
            --timeout=60 \
            --timeout-method=thread
